name: RACE RADAR - Mise a jour quotidienne

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
      timezone: 'Europe/Paris'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'events.json'
      - 'scripts/collect_events.py'
      - 'tests/**'
      - '.github/workflows/race-radar.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: race-radar-pages
  cancel-in-progress: false

jobs:
  synchroniser-et-publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: python -m pip install 'beautifulsoup4>=4.12,<5'

      - name: Tester le programme
        run: python -m unittest discover -s tests -v

      - name: Collecter FFA et surveiller calendriers officiels 67-68
        run: python scripts/collect_events.py

      - name: Enregistrer les donnees
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- events.json
          if [ -f review_candidates.json ]; then
            git add -- review_candidates.json
          fi
          if [ -f source_watch.json ]; then
            git add -- source_watch.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'RACE RADAR : synchronisation des donnees'
            git push
          else
            echo 'Aucune modification des donnees.'
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
