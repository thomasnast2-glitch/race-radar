name: RACE RADAR - Mise a jour quotidienne

on:
  schedule:
    - cron: '17 6 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'events.json'
      - 'scripts/collect_events.py'
      - 'tests/**'
      - '.github/workflows/race-radar.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: race-radar-pages
  cancel-in-progress: false

jobs:
  synchroniser-et-publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer les fichiers du site
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5'
      - name: Tester l'extraction avec des exemples
        run: python -m unittest discover -s tests -v
      - name: Collecter FFA et Running-Trail 67-68
        run: python scripts/collect_events.py
      - name: Sauvegarder la collecte sur GitHub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.json review_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'RACE RADAR : collecte quotidienne multi-sources'
            git push
          else
            echo 'Aucune modification des donnees.'
          fi
      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
