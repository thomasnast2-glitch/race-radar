name: Interface et regressions

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest test_collect_events test_hyrox_apply test_hyrox_watch -v
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
